<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found | Faiz Insani</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,body{height:100%;margin:0}
      body{background:#0A0A0C;color:#E0E0E6;font-family:ui-sans-serif,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
      .wrap{text-align:center;padding:1.5rem}
      .code{font-family:ui-monospace,monospace;color:#06b6d4;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase}
      h1{font-size:clamp(3rem,12vw,6rem);margin:.5rem 0 0;font-weight:800;letter-spacing:-.04em}
      p{color:rgba(255,255,255,.6);max-width:28rem;margin:1rem auto 2rem;line-height:1.6}
      a{display:inline-block;padding:.75rem 1.5rem;background:#fff;color:#000;font-weight:700;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;text-decoration:none}
      a:hover{background:#06b6d4}
    </style>
  </head>
  <body>
    <div class="wrap">
      <span class="code">$ error 404</span>
      <h1>Not found.</h1>
      <p>This page doesn't exist, or it moved. Head back to the homepage.</p>
      <a href="/">Return home</a>
    </div>
  </body>
</html>
